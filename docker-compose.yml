services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studyroom
      POSTGRES_USER: studyroom
      POSTGRES_PASSWORD: studyroom
    ports: ["5432:5432"]
    volumes: ["studyroom_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyroom -d studyroom"]
      interval: 3s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.9
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_KEYS:-devkey: secret}"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/tcp"
      - "7882:7882/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7880/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  studyroom_postgres:
