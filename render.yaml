services:
  - type: web
    name: studyroom-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build:api
    startCommand: npm run render:start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: studyroom-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: TRUST_PROXY
        value: "true"

databases:
  - name: studyroom-db
    databaseName: studyroom
    user: studyroom
    region: singapore
    plan: free
    ipAllowList: []
